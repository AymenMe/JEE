server:
  port: 8888
spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
          routes:
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/customers/**
            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/products/**
            - id: billing-service
              uri: http://localhost:8083
              predicates:
                - Path=/bills/**
            - id: billing-service-full
              uri: http://localhost:8083
              predicates:
                - Path=/fullBill/**